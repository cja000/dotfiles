#################### List of plugins ####################
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
# set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'fabioluciano/tmux-powerkit'
# set -g @plugin 'tmux-plugins/tmux-yank'

run '~/.config/tmux/plugins/tpm/tpm'

#################### Status bar ####################
### Colors
BLACK="#1d2021"
BLUE="#7daea3"
CYAN="#b4f1fc"
GRAY_DARK="#505050"
GRAY_LIGHT="#DDDDDD"
GRAY_MEDIUM="#999999"
GREEN_DARK="#387c00"
GREEN_LIGHT="#a9fd64"
MAGENTA="#d3869b"
RED="#ea6962"
YELLOW="#d8a657"

### Nerdfont characters
HALF_ROUND_OPEN="#(printf '\uE0B6')"
HALF_ROUND_CLOSE="#(printf '\uE0B4')"
TRIANGLE_OPEN="#(printf '\uE0B2')"
TRIANGLE_CLOSE="#(printf '\uE0B0')"
CIRCLE="#(printf '\uEB8A')"
ZOOM="#(printf '\uEB81')"
TMUX_CONSOLE="#(printf '\uEBC8')"
COMMAND_CONSOLE="#(printf '\uF489')"
SERVER="#(printf '\uEB50')"

### Configuration
set -g status-interval 60
set -g status-left-length 100
set -g status-right-length 100
set -g window-status-separator ""
# Basic colors of the Statusbar
set -g status-style "fg=${GRAY_LIGHT},bg=${GRAY_DARK}"
# Show the window list centered between the left and the right section
set -g status-justify centre

# Style and set contents on the left section
set -g status-left "#[bg=${GREEN_LIGHT},fg=${GREEN_DARK},bold] \
${TMUX_CONSOLE} #S \
#[bg=default,fg=${GREEN_LIGHT}]${HALF_ROUND_CLOSE}\
"

# Style and set contents on the right section
set-option -g status-right "\
#[bg=default,fg=${GREEN_LIGHT}]${HALF_ROUND_OPEN}\
#[bg=${GREEN_LIGHT},fg=${GREEN_DARK},bold]\
${SERVER} #h %H:%M\
#[bg=default,fg=${GREEN_LIGHT}]\
"

# Style and set contents on the current window
set -g window-status-current-format "\
#[fg=${MAGENTA},bg=default]${HALF_ROUND_OPEN}\
#[fg=${DARK_GRAY},bg=${MAGENTA},bold]\
#[fg=${CYAN},bg=${MAGENTA}]\
#[underscore]#I:#W#[nounderscore]\
#{?window_zoomed_flag,${ZOOM},}\
#[fg=${MAGENTA},bg=default]${HALF_ROUND_CLOSE}\
"

# Style and set contents on default windows
set -g window-status-format "\
#[fg=${GRAY_MEDIUM},bg=default]${HALF_ROUND_OPEN}\
#[fg=${GRAY_DARK},bg=${GRAY_MEDIUM},bold]\
#I:#W\
#{?window_zoomed_flag, ${ZOOM} ,}\
#[fg=${GRAY_MEDIUM},bg=default]${HALF_ROUND_CLOSE}\
"

#################### Clipboard ####################
set -s set-clipboard on
set -g allow-passthrough on

#################### scrollback buffer n lines ####################
set -g history-limit 100000
set-window-option -g xterm-keys on

#################### Leader key ####################
# Use Ctrl-Space as prefix. Double Ctrl-Space to send to application
set -g prefix C-Space
bind C-Space send-prefix
# Remove Ctrl-b and prefix2
unbind C-b
set -g prefix2 None

#################### Windows and panes numbering and naming ####################
### Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

### Don't rename windows automatically (Use <leader> , to rename window)
set-window-option -g automatic-rename off
set-option -g allow-rename off

### Renumber windows automatically
set-option -g renumber-windows on

#################### Enable mouse mode ####################
# (tmux 2.1 and above)
set -g mouse on

#################### Terminal configuration ####################
### Reduce time for escape sequences.
# Too low (10) will display text 11;rgb... starting tmux
set -s escape-time 100

### Colours can be defined both with RGB or with colour0 to colour255:
set-option -g default-terminal 'tmux-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'
set -ga terminal-overrides ",*256col*:Tc"

### Start with Zsh new panes or windows
set-option -g default-shell /usr/bin/zsh

# loud or quiet?
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g bell-action none
setw -g monitor-activity off

#################### Key bindings ####################
########## Panes
### Split panes using | and -, make sure they open in the same path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind %
unbind '"'

### Pane movement. Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

### Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

### Pane resize
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

########## Windows
### Refresh tmux config with r
unbind r
bind r source-file ~/.config/tmux/tmux.conf

### Refresh client window
bind C-R refresh-client

### Set the window name
bind R command-prompt 'rename-window %%'

### Change of window
# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window
# Alt+H and Alt+L (uppercase vim keys) to switch windows
bind -n M-H previous-window
bind -n M-L next-window
# PageUp and PageDown to move between windows
bind Pageup previous-window
bind Pagedown next-window

### Move window position
# <leader> Shift+Left or Shift+Right to move Window to left/right
bind S-Left swap-window -t -1
bind S-Right swap-window -t +1
# Also <leader> N y <leader> P (uppercase)
bind P swap-window -t -1
bind N swap-window -t +

################################################################################

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Extended keys
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

### Sane scrolling
set -ga terminal-overrides ',xterm*:smcup@:rmcup@'
